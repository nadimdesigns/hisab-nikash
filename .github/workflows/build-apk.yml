name: Build Android APK

# This branch (Apk) only holds the Android shell: android/ and capacitor.config.ts.
# The UI comes from `main`, built as the offline "apk" variant (VITE_APP_TARGET=apk), so there is
# no UI code to keep in sync here. After install the app updates its UI over the air from the
# live site (/apk/version.json), so rebuild the APK only for native changes (plugins,
# permissions, icon, splash) or the first release.
on:
  push:
    branches: [Apk]
  workflow_dispatch:
    inputs:
      ui_ref:
        description: "Branch / commit of the UI to package"
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the UI (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ui_ref || 'main' }}

      - name: Checkout the Android shell (Apk branch)
        uses: actions/checkout@v4
        with:
          ref: Apk
          path: shell

      - name: Add the Android shell to the UI project
        run: |
          cp -r shell/android ./android
          cp shell/capacitor.config.ts ./capacitor.config.ts
          echo "APP_VERSION=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the offline UI bundle (apk variant)
        env:
          VITE_APP_TARGET: apk
          NODE_ENV: production
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore the upload keystore (if the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_* secrets are not set: the Play bundle will be UNSIGNED (not uploadable)."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK and release bundle (AAB)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug bundleRelease -PversionCodeOverride=${{ github.run_number }} --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/hisab-nikash.apk
          if [ "$SIGNED" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab releases/hisab-nikash.aab
          else
            cp android/app/build/outputs/bundle/release/app-release.aab releases/hisab-nikash-UNSIGNED.aab
          fi
          ls -lh releases

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hisab-nikash-android
          path: releases/*
          retention-days: 30

      - name: Publish APK to the "apk-latest" release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/Apk'
        with:
          tag_name: apk-latest
          name: "হিসাব নিকাশ Android (offline, auto-updating UI)"
          body: |
            Offline Android app. The UI updates itself over the air whenever the app is opened online.
            Install this APK once; install a new one only when the release notes mention a native change.

            `hisab-nikash.aab` is the signed Google Play bundle (attached only when the signing secrets are configured).
          files: |
            releases/hisab-nikash.apk
            releases/hisab-nikash.aab
