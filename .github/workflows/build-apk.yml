name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          node -v
          npx cap sync android || npx @capacitor/cli sync android || true

      - name: Ensure Assets in Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          if [ ! -f android/app/src/main/assets/capacitor.config.json ]; then
            echo '{"appId":"app.userheaven.hisabnikash","appName":"হিসাব নিকাশ","webDir":"dist"}' > android/app/src/main/assets/capacitor.config.json
          fi
          if [ ! -f android/app/src/main/assets/capacitor.plugins.json ]; then
            echo '[]' > android/app/src/main/assets/capacitor.plugins.json
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Locate and Copy APK
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/hisab-nikash.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./hisab-nikash.apk
          ls -lh releases/hisab-nikash.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisab-nikash-apk
          path: releases/hisab-nikash.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-offline
          name: "হিসাব নিকাশ v1.0 (Offline Android App)"
          body: |
            ## হিসাব নিকাশ - সম্পূর্ণ অফলাইন অ্যান্ড্রয়েড অ্যাপ 📱

            - 🚀 **কোনো লগইন বা ইন্টারনেটের প্রয়োজন নেই**: অ্যাপ চালু করলেই সরাসরি হোমপেজ ওপেন হবে।
            - 💾 **ডিভাইস স্টোরেজ**: সমস্ত পণ্য, বিক্রি ও বাকির হিসাব সরাসরি আপনার ফোনের মেমরিতে সংরক্ষিত থাকবে।
            - ⚡ **১০০% অফলাইন**: ইন্টারনেট কানেকশন ছাড়াই সব ফিচার কাজ করবে।

            ### ডাউনলোড ও ইনস্টল:
            নিচের Assets সেকশন থেকে `hisab-nikash.apk` ফাইলে ক্লিক করে ডাউনলোড করুন এবং ফোনে ইনস্টল করুন।
          files: releases/hisab-nikash.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
